<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tolecito - Key System Pro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f0f14;
      background-image: radial-gradient(circle at 50% 0%, #1f2235 0%, #0f0f14 70%);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: #16161c;
      border: 1.5px solid #414155;
      border-radius: 14px;
      width: 100%;
      max-width: 420px;
      padding: 28px 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    .badge {
      display: inline-block;
      background-color: rgba(88, 101, 242, 0.15);
      color: #7289da;
      border: 1px solid rgba(88, 101, 242, 0.4);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 12px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #ffffff;
    }

    p {
      font-size: 13px;
      color: #aaaab9;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .key-box {
      background-color: #22222c;
      border: 1px solid #353545;
      border-radius: 8px;
      padding: 14px;
      font-family: Consolas, monospace;
      font-size: 14px;
      color: #50e678;
      word-break: break-all;
      margin-bottom: 18px;
      user-select: all;
    }

    .key-box.error {
      color: #f55f5f;
    }

    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      background-color: #5865f2;
      color: #ffffff;
    }

    .btn:hover {
      background-color: #4752c4;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn.copied {
      background-color: #2dc770;
    }

    .footer {
      margin-top: 18px;
      font-size: 11px;
      color: #666677;
    }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge" id="badgeStatus">Verificando Acceso</span>
    <h1 id="titleText">TOLECITO - KEY SYSTEM</h1>
    <p id="descText">Generando clave única protegida...</p>

    <div class="key-box" id="keyDisplay">Cargando...</div>

    <button class="btn" id="actionBtn">Procesando...</button>

    <div class="footer">Sistema protegido contra bypass y replicación</div>
  </div>

  <script>
    -- ==========================================
    -- PROTECCIONES EN CLIENTE WEB (VERCEL)
    -- ==========================================

    // 1. Bloquear clic derecho y consola / inspección de elementos
    document.addEventListener("contextmenu", (e) => e.preventDefault());
    document.addEventListener("keydown", (e) => {
      if (e.key === "F12" || (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J")) || (e.ctrlKey && e.key === "u")) {
        e.preventDefault();
      }
    });

    const params = new URLSearchParams(window.location.search);
    const linkAcortador = "https://work.ink/463737/tolecitokey"; // Tu link actual de Work.ink

    // 2. Extracción y validación estricta de formato UUID único
    const matchUUID = window.location.href.match(/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/);
    const rawKey = params.get("key") || params.get("token") || (matchUUID ? matchUUID[0] : null);
    
    const key = (rawKey && rawKey !== "{TOKEN}" && rawKey.length === 36) ? rawKey : null;

    const keyDisplay = document.getElementById("keyDisplay");
    const actionBtn = document.getElementById("actionBtn");
    const badgeStatus = document.getElementById("badgeStatus");
    const descText = document.getElementById("descText");

    if (key) {
      -- 3. Ocultar la key de la URL inmediatamente para evitar que la compartan o repliquen desde el historial
      window.history.replaceState({}, document.title, window.location.pathname);

      badgeStatus.textContent = "Acceso Concedido";
      descText.textContent = "Copia tu clave única protegida y pégala en la ventana del script dentro de Roblox.";
      keyDisplay.textContent = key;
      actionBtn.textContent = "Copiar Key";

      actionBtn.addEventListener("click", () => {
        navigator.clipboard.writeText(key).then(() => {
          actionBtn.textContent = "¡Key Copiada al Portapapeles!";
          actionBtn.classList.add("copied");
          setTimeout(() => {
            actionBtn.textContent = "Copiar Key";
            actionBtn.classList.remove("copied");
          }, 2500);
        });
      });
    } else {
      -- Bloqueo si intentan entrar directo sin completar anuncios o sin token válido
      badgeStatus.textContent = "Acceso Denegado";
      badgeStatus.style.color = "#f55f5f";
      badgeStatus.style.borderColor = "rgba(245, 95, 95, 0.4)";
      badgeStatus.style.backgroundColor = "rgba(245, 95, 95, 0.12)";
      descText.textContent = "No se detectó una clave válida. Debes completar los pasos en Work.ink para obtener acceso.";
      keyDisplay.textContent = "ERROR-TOKEN-INVALIDO";
      keyDisplay.classList.add("error");
      actionBtn.textContent = "Ir a Obtener Key";

      actionBtn.addEventListener("click", () => {
        window.location.href = linkAcortador;
      });
    }
  </script>

</body>
</html>
